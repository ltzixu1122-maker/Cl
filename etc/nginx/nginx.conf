# Load copied Nginx modules, which include Lua script & caching support.
include /etc/nginx/modules-enabled/10-mod-http-ndk.conf;
include /etc/nginx/modules-enabled/50-mod-http-lua.conf;

env APPLET_ID;
env DISABLE_AUTH_BRIDGE;

worker_processes auto;

events {
    worker_connections 512;
}

http {
    lua_shared_dict auth_token_cache 1m;
    resolver 8.8.8.8;

    server {
        listen 8080;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 64M;

        include /etc/nginx/nginx_auth.conf.include;

        location /__aistudio_internal_control_plane/ {
            proxy_pass http://localhost:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;
        }

        # Direct Public APK Download routes (no auth required)
        location = /coupon-lo.apk {
            alias /app/applet/web_dist/coupon-lo.apk;
            default_type application/vnd.android.package-archive;
            add_header Content-Disposition 'attachment; filename="coupon-lo.apk"';
            add_header Access-Control-Allow-Origin *;
        }

        location = /app-debug.apk {
            alias /app/applet/web_dist/coupon-lo.apk;
            default_type application/vnd.android.package-archive;
            add_header Content-Disposition 'attachment; filename="coupon-lo.apk"';
            add_header Access-Control-Allow-Origin *;
        }

        location = /apk {
            alias /app/applet/web_dist/coupon-lo.apk;
            default_type application/vnd.android.package-archive;
            add_header Content-Disposition 'attachment; filename="coupon-lo.apk"';
            add_header Access-Control-Allow-Origin *;
        }

        # Public Landing Page with direct download button
        location = / {
            root /app/applet/web_dist;
            try_files /index.html =404;
            add_header Access-Control-Allow-Origin *;
        }

        location /download/ {
            alias /app/applet/web_dist/;
            index index.html;
            add_header Access-Control-Allow-Origin *;
        }

        location /_aistudio-iframe.js {
            alias /var/www/assets/_aistudio-iframe.js;
            default_type application/javascript;
            expires 1y;
            add_header Cache-Control "public, no-transform, immutable";
        }

        location /warmup.html {
            internal;
            alias /var/www/assets/warmup.html;
            default_type text/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            expires 0;
        }
    }
}
